<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/streamlit-component-lib/dist/streamlit-component-lib.js"></script>
<style>
  body { margin: 0; padding: 4px 0; font-family: 'Segoe UI', sans-serif; background: transparent; }
  #btn {
    background: #2E7D32; color: white; border: none;
    border-radius: 20px; padding: 6px 16px;
    font-size: 0.85rem; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; white-space: nowrap;
  }
  #btn:disabled { background: #81C784; cursor: default; }
  #btn.ok { background: #388E3C; }
  #msg { font-size: 0.78rem; color: #666; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<button id="btn" onclick="pedir()">📍 Usar minha localização</button>
<span id="msg"></span>

<script>
  Streamlit.setComponentReady();

  // Tenta automático silencioso (funciona no desktop/Android Chrome)
  // Sem timeout longo pra não travar no mobile
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) { enviar(pos); },
      function() { /* silencioso — botão como fallback para iOS */ },
      { enableHighAccuracy: false, timeout: 4000, maximumAge: 120000 }
    );
  }

  function pedir() {
    if (!navigator.geolocation) {
      document.getElementById('msg').textContent = '❌ Geolocalização não suportada.';
      return;
    }
    var btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('msg').textContent = '⏳ Buscando...';

    navigator.geolocation.getCurrentPosition(
      function(pos) { enviar(pos); },
      function(err) {
        btn.disabled = false;
        document.getElementById('msg').textContent = '⚠️ Permissão negada.';
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  }

  function enviar(pos) {
    var btn = document.getElementById('btn');
    btn.textContent = '✅ Localização obtida';
    btn.classList.add('ok');
    btn.disabled = true;
    document.getElementById('msg').textContent = '';
    Streamlit.setComponentValue({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: Math.round(pos.coords.accuracy)
    });
  }
</script>
</body>
</html>
